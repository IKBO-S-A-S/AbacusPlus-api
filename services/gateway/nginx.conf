map $http_origin $cors_origin {
    default "";
    "~^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$" "$http_origin";
    # Producción: abacus.ikbo.co y cualquier subdominio *.ikbo.co
    "~^https://([a-z0-9-]+\.)*ikbo\.co$" "$http_origin";
}

# Extract tenant slug from subdomain (e.g. ikbo.app.abacusplus.com → ikbo)
# Falls back to empty string when no subdomain match (API-client mode)
map $host $tenant_slug_from_subdomain {
    default "";
    "~^(?P<slug>[^.]+)\.app\." "$slug";
}

server {
    listen 80;
    server_name _;

    # Docker embedded DNS — enables dynamic per-request resolution for all upstreams
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $xml_processor_url         http://xml-processor:8001;
    set $rag_service_url           http://rag-service:8002;
    set $llm_service_url           http://llm-service:8003;
    set $session_proxy_url         http://session-proxy:8004;
    set $odoo_service_url          http://odoo-service:8005;
    set $siigo_service_url         http://siigo-service:8006;
    set $integration_config_url    http://integration-config-service:8007;
    set $auth_service_url          http://auth-service:8008;
    # Subida de archivos ZIP/XML (hasta 50 MB)
    client_max_body_size 50M;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization     $http_authorization;
    # Subdomain takes precedence; falls back to client-supplied header (API-client mode)
    set $effective_tenant_slug $http_x_tenant_slug;
    if ($tenant_slug_from_subdomain != "") {
        set $effective_tenant_slug $tenant_slug_from_subdomain;
    }
    proxy_set_header X-Tenant-Slug     $effective_tenant_slug;
    proxy_read_timeout 120s;

    # ── Cabeceras de seguridad ────────────────────────────────────────────────
    # No había ninguna. Son baratas y cubren riesgos que el código no puede cubrir solo.
    #
    # `nosniff`: sin ella, un navegador puede decidir por su cuenta que una respuesta es
    # HTML o JavaScript pese al Content-Type declarado. Esta API devuelve XML y PDF subidos
    # por terceros; que el navegador los reinterprete es exactamente lo que no debe pasar.
    #
    # `DENY` en frames: la aplicación no se embebe en ningún sitio, así que prohibirlo entero
    # elimina el clickjacking sin coste.
    #
    # `no-referrer`: las URLs llevan identificadores de documento; no tienen por qué viajar
    # como Referer hacia terceros.
    #
    # No se añade HSTS aquí a propósito: este bloque escucha en HTTP y es el terminador TLS
    # de delante quien debe emitirla. Ponerla aquí no tendría efecto en HTTP y, si algún día
    # este puerto se expusiera en claro, sería una cabecera ignorada que da falsa confianza.
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # ── CORS global ────────────────────────────────────────────────────────────
    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, X-Tenant-Slug" always;
    add_header Access-Control-Max-Age       86400 always;

    # Preflight OPTIONS — responde directamente sin pasar a los servicios
    if ($request_method = OPTIONS) {
        return 204;
    }

    # ── SEGURIDAD: Bloquear rutas internas desde el exterior ──────────────────
    # /internal/* solo es accesible dentro de la red Docker, nunca por clientes externos.
    location ~ ^/internal/ {
        return 403;
    }

    # ── auth-service ───────────────────────────────────────────────────────────
    location /api/v1/auth {
        proxy_pass $auth_service_url;
    }

    location /api/v1/tenants {
        proxy_pass $auth_service_url;
    }

    location /api/v1/users {
        proxy_pass $auth_service_url;
    }

    # ── xml-processor ──────────────────────────────────────────────────────────
    location /api/v1/documents {
        proxy_pass $xml_processor_url;

        # RF-05: la contabilización en lote (`POST /documents/accounting-entries`) procesa
        # los documentos en serie contra SIIGO, así que su duración es la suma de todas las
        # llamadas externas. Con los 120 s heredados del bloque global, un lote grande —o
        # uno normal con SIIGO lento— se cortaría aquí con un 504 mientras el backend sigue
        # trabajando: los documentos terminarían contabilizándose sin que el usuario llegue
        # a ver el resumen, y el frontend no sabría cuáles.
        #
        # El límite real lo pone el backend (máximo 50 documentos por envío); este margen
        # solo evita que el proxy corte antes que él. SIIGO recomienda esperar 120 s por
        # comprobante, de ahí que el techo sea holgado.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location /api/v1/receivers {
        proxy_pass $xml_processor_url;
    }

    location /api/v1/issuers {
        proxy_pass $xml_processor_url;
    }

    location /api/v1/catalog {
        proxy_pass $xml_processor_url;
    }

    location /api/v1/batch-jobs {
        proxy_pass $xml_processor_url;
    }

    location /api/v1/batch-logs {
        proxy_pass $xml_processor_url;
    }

    # ── llm-service ────────────────────────────────────────────────────────────
    location /api/v1/query {
        proxy_pass $llm_service_url;
    }

    location /api/v1/analyses {
        proxy_pass $llm_service_url;
    }

    location /api/v1/accounting {
        proxy_pass $llm_service_url;
        proxy_read_timeout 120s;
    }

    # ── odoo-service ──────────────────────────────────────────────────────────
    location /api/v1/odoo {
        proxy_pass $odoo_service_url;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
    }

    # ── siigo-service ─────────────────────────────────────────────────────────
    location /api/v1/siigo {
        proxy_pass $siigo_service_url;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── integration-config-service ────────────────────────────────────────────
    location /api/v1/integrations {
        proxy_pass $integration_config_url;
    }

    # ── rag-service (interno, expuesto para debug/admin) ───────────────────────
    location /api/v1/chunks {
        proxy_pass $rag_service_url;
    }

    # ── session-proxy ──────────────────────────────────────────────────────────
    location /api/v1/dian {
        proxy_pass $session_proxy_url;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/v1/proxy {
        proxy_pass $session_proxy_url;
    }

    # ── Documentación centralizada ─────────────────────────────────────────────
    location = /docs {
        root /usr/share/nginx/html;
        try_files /docs.html =404;
        add_header Cache-Control "no-cache";
    }

    # `location = /docs` es de coincidencia exacta, así que /docs/ (con barra final) caía al
    # catch-all y devolvía 404. Es un tropiezo frecuente al copiar la URL desde el navegador,
    # que la añade solo. Se redirige en lugar de dejar el error.
    #
    # `absolute_redirect off` es imprescindible: por defecto nginx arma la redirección con el
    # nombre del servidor y PIERDE el puerto, mandando a http://localhost/docs en vez de
    # localhost:8000. Con la redirección relativa el navegador conserva el puerto de origen.
    location = /docs/ {
        absolute_redirect off;
        return 301 /docs;
    }

    location /openapi/xml-processor.json {
        proxy_pass $xml_processor_url/openapi.json;
        add_header Access-Control-Allow-Origin *;
    }

    location /openapi/llm-service.json {
        proxy_pass $llm_service_url/openapi.json;
        add_header Access-Control-Allow-Origin *;
    }

    location /openapi/rag-service.json {
        proxy_pass $rag_service_url/openapi.json;
        add_header Access-Control-Allow-Origin *;
    }

    location /openapi/session-proxy.json {
        proxy_pass $session_proxy_url/openapi.json;
        add_header Access-Control-Allow-Origin *;
    }

    location /openapi/odoo-service.json {
        proxy_pass $odoo_service_url/openapi.json;
        add_header Access-Control-Allow-Origin *;
    }

    location /openapi/siigo-service.json {
        proxy_pass $siigo_service_url/openapi.json;
        add_header Access-Control-Allow-Origin *;
    }

    location /openapi/integration-config-service.json {
        proxy_pass $integration_config_url/openapi.json;
        add_header Access-Control-Allow-Origin *;
    }

    location /openapi/auth-service.json {
        proxy_pass $auth_service_url/openapi.json;
        add_header Access-Control-Allow-Origin *;
    }

    # ── Health checks individuales ─────────────────────────────────────────────
    location /health/xml-processor {
        proxy_pass $xml_processor_url/health;
    }

    location /health/rag-service {
        proxy_pass $rag_service_url/health;
    }

    location /health/llm-service {
        proxy_pass $llm_service_url/health;
    }

    location /health/session-proxy {
        proxy_pass $session_proxy_url/health;
    }

    location /health/odoo-service {
        proxy_pass $odoo_service_url/health;
    }

    location /health/siigo-service {
        proxy_pass $siigo_service_url/health;
    }

    location /health/integration-config-service {
        proxy_pass $integration_config_url/health;
    }

    location /health/auth-service {
        proxy_pass $auth_service_url/health;
    }

    # ── Health del gateway ─────────────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 '{"status":"ok","service":"gateway"}';
        add_header Content-Type application/json;
    }
}
